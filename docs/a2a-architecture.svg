  <rect class="app" x="555" y="155" width="325" height="115" rx="16"/>
  <text class="node-title" x="718" y="202">A2A client simulator</text>
  <g transform="translate(686 220)">
    <rect x="0" y="0" width="15" height="15" fill="#ff3621"/>
    <rect x="20" y="0" width="15" height="15" fill="#ff9b8b"/>
    <rect x="0" y="20" width="15" height="15" fill="#ff9b8b"/>
    <rect x="20" y="20" width="15" height="15" fill="#ff3621"/>
  </g>


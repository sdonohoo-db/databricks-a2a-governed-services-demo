<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1b3139; }
      .section { fill: #fbfaf8; stroke: #c7cbd1; stroke-width: 2; stroke-dasharray: 8 7; }
      .source { fill: #f4f1ec; stroke: #1b3139; stroke-width: 2.5; }
      .app { fill: #ffd9d0; stroke: #ff3621; stroke-width: 2.5; }
      .service { fill: #ffece7; stroke: #ff3621; stroke-width: 2.5; }
      .compute { fill: #eef3f5; stroke: #1b3139; stroke-width: 2.5; }
      .govern { fill: #1b3139; stroke: #1b3139; stroke-width: 2.5; }
      .gateway-group { fill: #fff7f5; stroke: #ff9b8b; stroke-width: 2; }
      .flow { fill: none; stroke: #1b3139; stroke-width: 3; marker-end: url(#arrow); }
      .a2a { fill: none; stroke: #ff3621; stroke-width: 4; marker-end: url(#arrow-lava); }
      .telemetry { fill: none; stroke: #5f6b73; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-muted); }
      .label { font-size: 18px; fill: #5f6b73; }
      .small { font-size: 16px; fill: #5f6b73; }
      .node-title { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .section-title { font-size: 25px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b3139"/>
    </marker>
    <marker id="arrow-lava" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff3621"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6b73"/>
    </marker>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>

  <rect class="section" x="30" y="90" width="340" height="690" rx="22"/>
  <text class="section-title" x="200" y="63">External agentic platform</text>

  <circle class="source" cx="200" cy="188" r="25"/>
  <path class="source" d="M158 250c0-27 19-45 42-45s42 18 42 45z"/>
  <text class="node-title" x="200" y="292">User or workflow</text>
  <path class="flow" d="M200 310 V340"/>

  <rect class="source" x="70" y="350" width="260" height="120" rx="14"/>
  <text class="node-title" x="200" y="402">Google ADK</text>
  <text class="node-title" x="200" y="434">A2A client</text>

  <rect class="section" x="410" y="40" width="1360" height="920" rx="24"/>
  <text class="section-title" x="1090" y="28">Databricks</text>

  <rect class="section" x="450" y="110" width="520" height="620" rx="20"/>
  <text class="section-title" x="710" y="92">Databricks Apps</text>

  <rect class="app" x="545" y="150" width="330" height="125" rx="16"/>
  <text class="node-title" x="710" y="196">A2A client simulator</text>
  <text class="small" x="710" y="224" text-anchor="middle">Demonstrates discovery and delegation</text>
  <g transform="translate(692 232)">
    <rect x="0" y="0" width="12" height="12" fill="#ff3621"/>
    <rect x="16" y="0" width="12" height="12" fill="#ff9b8b"/>
    <rect x="0" y="16" width="12" height="12" fill="#ff9b8b"/>
    <rect x="16" y="16" width="12" height="12" fill="#ff3621"/>
  </g>

  <rect class="app" x="545" y="350" width="330" height="220" rx="16"/>
  <text class="node-title" x="710" y="390">A2A provider</text>
  <text class="label" x="710" y="420" text-anchor="middle">Agent Card + JSON-RPC</text>
  <path d="M580 450 H840" fill="none" stroke="#ff9b8b" stroke-width="2"/>
  <text class="node-title" x="710" y="488">Delegation + task execution</text>
  <text class="small" x="710" y="518" text-anchor="middle">Client-selected or autonomous mode</text>
  <g transform="translate(692 530)">
    <rect x="0" y="0" width="12" height="12" fill="#ff3621"/>
    <rect x="16" y="0" width="12" height="12" fill="#ff9b8b"/>
    <rect x="0" y="16" width="12" height="12" fill="#ff9b8b"/>
    <rect x="16" y="16" width="12" height="12" fill="#ff3621"/>
  </g>

  <path class="a2a" d="M710 275 V350"/>
  <text class="label" x="730" y="310">Discover + delegate</text>
  <path class="a2a" d="M330 410 H545"/>
  <text class="label" x="405" y="397">A2A</text>

  <rect class="section" x="1010" y="110" width="720" height="620" rx="20"/>
  <text class="section-title" x="1370" y="92">Governed Databricks services</text>

  <rect class="gateway-group" x="1035" y="130" width="360" height="460" rx="18"/>
  <text class="section-title" x="1215" y="165">Unity Gateway</text>

  <rect class="app" x="1065" y="185" width="300" height="110" rx="16"/>
  <text class="node-title" x="1215" y="225">Model service</text>
  <text class="small" x="1215" y="255" text-anchor="middle">DAB-managed service</text>

  <rect class="compute" x="1435" y="195" width="235" height="90" rx="15"/>
  <text class="node-title" x="1553" y="232">Databricks-hosted</text>
  <text class="node-title" x="1553" y="260">foundation model</text>

  <rect class="app" x="1065" y="445" width="300" height="110" rx="16"/>
  <text class="node-title" x="1215" y="490">DBSQL MCP service</text>
  <text class="label" x="1215" y="525" text-anchor="middle">system.ai.dbsql</text>

  <rect class="compute" x="1435" y="455" width="235" height="90" rx="15"/>
  <text class="node-title" x="1553" y="493">SQL warehouse</text>
  <text class="small" x="1553" y="521" text-anchor="middle">Executes generated SQL</text>

  <rect class="govern" x="1435" y="600" width="235" height="80" rx="15"/>
  <text class="node-title" x="1553" y="633" style="fill:#ffffff">Unity Catalog</text>
  <text class="node-title" x="1553" y="661" style="fill:#ffffff">function</text>

  <path class="flow" d="M875 400 H990 V240 H1065"/>
  <text class="label" x="900" y="387">Model request</text>
  <path class="flow" d="M875 500 H1065"/>
  <text class="label" x="900" y="487">Tool call</text>
  <path class="flow" d="M1365 240 H1435"/>
  <text class="small" x="1400" y="227" text-anchor="middle">Route</text>
  <path class="flow" d="M1365 500 H1435"/>
  <text class="small" x="1400" y="487" text-anchor="middle">SQL</text>
  <path class="flow" d="M1553 545 V600"/>
  <text class="small" x="1570" y="580">Invoke</text>

  <rect class="section" x="450" y="790" width="1280" height="130" rx="20"/>

  <rect class="govern" x="545" y="830" width="330" height="70" rx="14"/>
  <text class="node-title" x="710" y="858" style="fill:#ffffff">App telemetry</text>
  <text class="small" x="710" y="884" text-anchor="middle" style="fill:#ffffff">OTel logs · spans · metrics</text>

  <rect class="govern" x="980" y="830" width="470" height="70" rx="14"/>
  <text class="node-title" x="1215" y="858" style="fill:#ffffff">Unity Gateway observability</text>
  <text class="small" x="1215" y="884" text-anchor="middle" style="fill:#ffffff">Model inference table · unified trace table</text>

  <path class="telemetry" d="M710 570 V830"/>
  <text class="small" x="720" y="710">Provider telemetry</text>
  <path class="telemetry" d="M1215 590 V830"/>
  <text class="small" x="1230" y="710">Model + MCP telemetry</text>
  <text class="section-title" x="963" y="775">Observability in Unity Catalog</text>
</svg>

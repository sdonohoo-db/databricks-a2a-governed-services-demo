  <text class="label" x="718" y="437" text-anchor="middle">Agent Card + JSON-RPC</text>
  <g transform="translate(698 450)">
    <rect x="0" y="0" width="12" height="12" fill="#ff3621"/>
    <rect x="16" y="0" width="12" height="12" fill="#ff9b8b"/>
    <rect x="0" y="16" width="12" height="12" fill="#ff9b8b"/>
    <rect x="16" y="16" width="12" height="12" fill="#ff3621"/>
  </g>

